version: 1.0
runtime: nodejs18
build:
  commands:
    build:
      - echo "Installing dependencies..."
      - npm install
      - echo "Building client..."
      - cd client && npm install && npm run build
      - echo "Installing server dependencies..."
      - cd ../server && npm install
      - echo "Build completed!"
run:
  runtime-version: 18
  command: cd server && node real-server.js
  network:
    port: 5000
    env: PORT
  env:
    - name: NODE_ENV
      value: production
    - name: PORT  
      value: "5000"