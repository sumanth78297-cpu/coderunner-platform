name: coderunner-platform
services:
- name: web
  source_dir: /
  github:
    repo: your-username/coderunner
    branch: main
  run_command: cd server && node real-server.js
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  build_command: |
    npm install
    cd client && npm install && npm run build
    cd ../server && npm install
  envs:
  - key: NODE_ENV
    value: "production"
  - key: PORT
    value: "8080"
  health_check:
    http_path: /api/health
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED