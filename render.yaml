services:
  - type: web
    name: coderunner-platform
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://coderunner-platform.onrender.com
    healthCheckPath: /api/health
    autoDeploy: false