services:
  - type: web
    name: coderunner-platform
    runtime: node
    plan: free
    buildCommand: |
      echo "=== Installing root dependencies ==="
      npm install
      echo "=== Building client ==="
      cd client 
      npm install --legacy-peer-deps
      npm run build
      echo "=== Installing server dependencies ==="  
      cd ../server 
      npm install
      echo "=== Build completed successfully ==="
    startCommand: cd server && node real-server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: https://coderunner-platform.onrender.com
    healthCheckPath: /api/health
    autoDeploy: false